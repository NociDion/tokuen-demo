<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOKUEN - Register</title>
    <style>
    html {
        visibility: hidden;
    }
</style>

  <body>
    <div class="tokuen-register-page">
      <div class="tokuen-register-shell">
          <aside class="tokuen-register-hero">
              <div class="tokuen-brand">
                  <span class="tokuen-brand-mark">
                      <img src="/images/TOKNLOGObw.png" alt="TOKUEN logo">
                  </span>
                  <span>TOKUEN</span>
              </div>

              <div>
                  <span class="tokuen-kicker">Smart lending workspace</span>
                  <h1>Create your TOKUEN account.</h1>
                  <p>Set up your secure profile for customer records, applications, and loan activity.</p>
              </div>

              <div class="tokuen-register-notes" aria-label="Registration benefits">
                  <span>Verified account access</span>
                  <span>Centralized borrower profile</span>
              </div>
          </aside>

          <section class="tokuen-register-card">
              <div class="tokuen-register-heading">
                  <h2>Register</h2>
                  <p>Complete your account and personal information.</p>
              </div>

      <form autocomplete="on" class="tokuen-register-form">
          <h3>Account</h3>
          <div>
              <label for="mobile-number">Mobile number <span class="tokuen-required">*</span></label>
              <input
                  id="mobile-number"
                  type="text"
                  wire:model="mobile_number"
                  placeholder="Mobile number" required>
          </div>

          <div>
              <label for="email">Email <span class="tokuen-required">*</span></label>
              <input
                  id="email"
                  type="email"
                  wire:model="email"
                  placeholder="Email" required>
          </div>

          <div>
              <label for="username">Username <span class="tokuen-required">*</span></label>
              <input
                  id="username"
                  type="text"
                  wire:model="username"
                  placeholder="Username" required>
          </div>

          <div>
              <label for="password">Password <span class="tokuen-required">*</span></label>
              <input
                  id="password"
                  type="password"
                  wire:model="password"
                  placeholder="Password" required>
          </div>

          <div>
              <label for="password-confirmation">Confirm Password <span class="tokuen-required">*</span></label>
              <input
                  id="password-confirmation"
                  type="password"
                  wire:model="password_confirmation"
                  placeholder="Confirm Password" required>
          </div>

          <h3>Personal info</h3>
          <div>
              <label for="first-name">First name <span class="tokuen-required">*</span></label>
              <input
                  id="first-name"
                  type="text"
                  wire:model="first_name"
                  placeholder="First name" required>
          </div>

          <div>
              <label for="last-name">Last name <span class="tokuen-required">*</span></label>
              <input
                  id="last-name"
                  type="text"
                  wire:model="last_name"
                  placeholder="Last name" required>
          </div>

          <div>
              <label for="middle-initial">Middle initial</label>
              <input
                  id="middle-initial"
                  type="text"
                  wire:model="middle_initial"
                  placeholder="Middle initial"
                  maxlength="10">
          </div>

          <div>
              <label for="suffix">Suffix</label>
              <input
                  id="suffix"
                  type="text"
                  wire:model="suffix"
                  placeholder="Suffix">
          </div>

          <div>
              <label for="address">Address <span class="tokuen-required">*</span></label>
              <input
                  id="address"
                  type="text"
                  wire:model="address"
                  placeholder="Address" required>
          </div>

          <div wire:ignore>
              <label for="gender-select">Gender <span class="tokuen-required">*</span></label>
              <select id="gender-select" wire:model="gender" required>
                  <option value="">Select Gender</option>
                  <option value="Female">Female</option>
                  <option value="Male">Male</option>
                  <option value="Prefer not to say">Prefer not to say</option>
              </select>
          </div>

          <div>
              <label for="birthday">Birthday <span class="tokuen-required">*</span></label>
              <input
                  id="birthday"
                  type="date"
                  wire:model="birthday"
                  min="1940-01-01"
                  max="{{ now()->format('Y-m-d') }}"
                  placeholder="Birthday" required>
          </div>
